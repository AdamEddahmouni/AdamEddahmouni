name: Render assets

# Regenerates every graphic on the profile README from the design tokens and
# live repository data, then commits the result. Fonts and icon paths are
# cached in tools/lib, so the only network calls are the repository metadata.

on:
  schedule:
    - cron: "23 5 * * *"   # daily, off the hour to avoid the top-of-hour rush
  workflow_dispatch:
  push:
    paths:
      - "tools/**"
      - "assets/**"
      - ".github/workflows/render-assets.yml"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: render-assets
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Refresh repository data
        run: node tools/fetch-repo-data.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Regenerate assets and check contrast
        run: node tools/render-all.mjs

      - name: Build asset manifest
        run: node tools/audit.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets tools/repo-data.json tools/manifest.json
          git diff --staged --quiet || git commit -m "chore: regenerate profile assets"
          git push || echo "nothing to push"
