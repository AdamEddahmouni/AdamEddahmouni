name: Render profile assets

# Regenerates the profile artwork from the design tokens and captured
# repository data, runs the quality gates, and commits the result.
#
# Scheduled publishing is intentionally NOT enabled. The schedule block below
# is commented out until the workflow has been reviewed and the owner has
# authorised automated commits to the published profile.
#
# Failure behaviour: assets are only committed when every generator and every
# gate succeeds. A failed run leaves the last published artwork untouched and
# surfaces the error in the job log.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/**"
      - "data/**"
      - "assets/**"
      - ".github/workflows/render-assets.yml"

  # schedule:
  #   - cron: "23 5 * * *"   # daily, off the hour

permissions:
  contents: write

concurrency:
  group: render-assets
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: "22"

      - name: Refresh captured repository data
        run: node tools/fetch-repo-data.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Regenerate assets and run gates
        run: node tools/render-all.mjs

      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets tools/manifest.json tools/repo-data.json tools/lib/font-cache.json
          if git diff --staged --quiet; then
            echo "No asset changes."
          else
            git commit -m "chore: regenerate profile assets"
            git push
          fi
