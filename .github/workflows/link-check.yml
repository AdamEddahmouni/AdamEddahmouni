name: Check README

on:
  push:
    paths:
      - "README.md"
      - "assets/**"
      - "tools/**"
      - ".github/workflows/link-check.yml"
      - ".markdownlint-cli2.yaml"
  schedule:
    - cron: "41 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-readme
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: "22"
      - name: Contrast gate
        run: node tools/check-contrast.mjs
      - name: README structure
        run: node tools/check-markdown.mjs
      - name: Existing SVG budgets and manifest
        run: node tools/check-assets.mjs
      - name: V4 raster assets and link integrity
        run: node tools/check-v4-assets.mjs
      - name: Every SVG is well-formed XML
        run: |
          status=0
          while IFS= read -r f; do
            if ! python3 -c "import xml.etree.ElementTree as E,sys; E.parse(sys.argv[1])" "$f" 2>/tmp/xmlerr; then
              echo "::error file=$f::invalid XML — $(tail -1 /tmp/xmlerr)"
              status=1
            fi
          done < <(find assets -name '*.svg')
          exit $status
      - name: Outbound links
        run: node tools/check-links.mjs
      - name: Markdown lint
        run: npx --yes markdownlint-cli2@0.13.0 "README.md" "docs/**/*.md"
