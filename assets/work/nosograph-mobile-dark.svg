<circle cx="67.2" cy="182" r="18" fill="none" stroke="#22D3C5" stroke-width="1.1" opacity=".75"/>
<circle cx="67.2" cy="182" r="25" fill="none" stroke="#344650" stroke-width=".7" opacity=".6" stroke-dasharray="2 4"/>
