<circle cx="326.4" cy="260.88" r="5" fill="#3F5560" opacity=".55"/>
</g>
<text x="24" y="330" style="font:500 22px 'Playfair Display', Georgia, 'Times New Roman', serif" fill="#F5F1E8" letter-spacing="-0.3">NosoGraph</text>
<path d="M422 312V304H430 M448 304H456V312 M456 320V328H448 M430 328H422V320" fill="none" stroke="#344650" stroke-width="1" opacity="0.5"/>
<rect width="480" height="360" filter="url(#grainF)" opacity="0.035" style="mix-blend-mode:overlay"/>
</g>
</svg>
