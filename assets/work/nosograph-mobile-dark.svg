<text x="24" y="34" style="font:500 14px 'IBM Plex Mono', ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" fill="#22D3C5" letter-spacing="2.2">01</text>
