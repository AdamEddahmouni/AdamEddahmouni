<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" fill="none" role="img" aria-labelledby="a11y-title">
<title id="a11y-title">NosoGraph — conceptual diagram</title>
<desc>biomedical evidence graph. Conceptual technical diagram, not a screenshot. Connects disease knowledge to the evidence behind it. Every claim carries its source, its direction and its certainty — and missing metadata stays unknown instead of quietly becoming a guess.</desc>
<style>@font-face{font-family:'IBM Plex Mono';font-style:normal;font-weight:500;src:url(data:font/woff2;base64,) format('woff2');font-display:block}@font-face{font-family:'Playfair Display';font-style:normal;font-weight:500;src:url(data:font/woff2;base64,) format('woff2');font-display:block}
*{animation-timing-function:cubic-bezier(.22,.61,.36,1)}
.wipe{transform-box:fill-box;transform-origin:left center;animation:wipe 1.5s cubic-bezier(.22,.61,.36,1) both}
.d1{animation-delay:.10s}.d2{animation-delay:.20s}.d3{animation-delay:.30s}
.d4{animation-delay:.40s}.d5{animation-delay:.50s}.d6{animation-delay:.60s}
.d7{animation-delay:.70s}.d8{animation-delay:.80s}
.fade{animation:fade 1.2s cubic-bezier(.22,.61,.36,1) both}
.breathe{animation:breathe 6s ease-in-out infinite}
.drift{animation:drift 18s ease-in-out infinite}
.scan{animation:scan 7s linear infinite}
@keyframes wipe{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}
@keyframes fade{0%{opacity:0}100%{opacity:1}}
@keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(14px,-10px)}}
@keyframes scan{0%{transform:translateX(-15%)}100%{transform:translateX(115%)}}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .wipe{transform:none!important}
  .fade{opacity:1!important}
  .scan{display:none}
}</style>
<defs>
<filter id="bloom" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="34"/></filter>
<filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="5"/></filter>
<filter id="grainF" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
<pattern id="workDots" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#17242E"/></pattern><clipPath id="workPlate"><rect x="1" y="1" width="478" height="358" rx="16"/></clipPath>
</defs>
<rect width="480" height="360" fill="transparent"/>
<rect x="1" y="1" width="478" height="358" rx="16" fill="#0F1B24" stroke="#22333D"/>
